<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALOUSH Training Library</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f4f1e7;
      --panel: #ffffff;
      --ink: #161616;
      --muted: #6f6f6f;
      --line: #e6e0d2;
      --brand: #20281c;
      --accent: #c6b77b;
      --accent-soft: #eee8cf;
      --danger: #9c2c2c;
      --radius: 20px;
      --shadow: 0 12px 35px rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans Hebrew", sans-serif;
      background: var(--bg);
      color: var(--ink);
      direction: rtl;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 320px 1fr;
      direction: rtl;
    }

    aside {
      direction: rtl;
      background: var(--brand);
      color: white;
      padding: 24px;
      overflow-y: auto;
      height: 100vh;
      position: sticky;
      top: 0;
    }

    main {
      direction: rtl;
      padding: 28px;
      overflow-x: hidden;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .logo-mark {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: var(--accent);
      display: grid;
      place-items: center;
      color: var(--brand);
      font-weight: 900;
      letter-spacing: 1px;
    }

    .logo h1 {
      font-size: 22px;
      margin: 0;
      line-height: 1.1;
    }

    .logo small { color: #d7d2c1; }

    .search {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.08);
      color: white;
      outline: none;
      margin-bottom: 18px;
      font-size: 15px;
    }

    .search::placeholder { color: #ddd6c4; }

    .side-title {
      color: #d7d2c1;
      font-size: 13px;
      margin: 22px 0 10px;
    }

    .category-btn, .workout-btn {
      width: 100%;
      text-align: right;
      border: none;
      cursor: pointer;
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 8px;
      color: white;
      background: rgba(255,255,255,0.07);
      transition: 0.15s ease;
    }

    .category-btn:hover, .workout-btn:hover, .category-btn.active, .workout-btn.active {
      background: var(--accent);
      color: var(--brand);
    }

    .category-row, .workout-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .count {
      font-size: 12px;
      background: rgba(255,255,255,0.18);
      border-radius: 999px;
      padding: 3px 8px;
      min-width: 26px;
      text-align: center;
    }

    .category-btn.active .count, .workout-btn.active .count { background: rgba(0,0,0,0.1); }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 22px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button.action {
      border: none;
      border-radius: 13px;
      padding: 12px 16px;
      cursor: pointer;
      background: var(--brand);
      color: white;
      font-weight: 700;
    }

    button.secondary { background: var(--accent-soft); color: var(--brand); }
    button.danger { background: #f4d8d8; color: var(--danger); }

    .hero {
      background: var(--panel);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
      margin-bottom: 18px;
    }

    .kicker {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      background: var(--accent-soft);
      color: var(--brand);
      border-radius: 999px;
      padding: 8px 14px;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .hero h2 {
      font-size: clamp(30px, 4vw, 42px);
      margin: 0 0 6px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: var(--ink);
      font-size: 20px;
      font-weight: 800;
      margin: 0 0 8px;
    }

    .goal-line {
      color: var(--muted);
      font-size: 17px;
      line-height: 1.55;
      margin: 0 0 18px;
      max-width: 980px;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 12px;
      margin-top: 14px;
    }

    .meta-card {
      background: #faf9f2;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
    }

    .meta-card small {
      display: block;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .meta-card strong {
      font-size: 17px;
      white-space: pre-wrap;
    }

    .blocks {
      display: grid;
      gap: 18px;
    }

    .block {
      background: var(--panel);
      border-radius: var(--radius);
      border: 1px solid var(--line);
      padding: 22px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.04);
      position: relative;
      overflow: hidden;
    }

    .block::before {
      content: "";
      position: absolute;
      right: 0;
      top: 0;
      width: 8px;
      height: 100%;
      background: var(--accent);
    }

    .block h3 {
      margin: 0 0 12px;
      font-size: 22px;
    }

    .block-content {
      white-space: pre-line;
      line-height: 1.75;
      font-size: 17px;
    }

    .block img {
      max-width: 100%;
      border-radius: 16px;
      margin-top: 16px;
      border: 1px solid var(--line);
    }

    .study .block-content {
      filter: blur(6px);
      user-select: none;
      cursor: pointer;
    }

    .study .block.revealed .block-content {
      filter: none;
      user-select: auto;
    }

    .study-hint {
      display: none;
      color: var(--muted);
      font-size: 13px;
      margin-top: 8px;
    }

    .study .study-hint { display: block; }

    textarea, input.edit-input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      font: inherit;
      background: #fffdf6;
      resize: vertical;
      direction: rtl;
    }

    textarea { min-height: 130px; }

    .empty {
      background: var(--panel);
      border-radius: var(--radius);
      padding: 50px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
    }

    .toast {
      position: fixed;
      left: 24px;
      bottom: 24px;
      background: var(--brand);
      color: white;
      padding: 14px 18px;
      border-radius: 14px;
      box-shadow: var(--shadow);
      display: none;
      z-index: 20;
    }

    .toast.show { display: block; }


    .page-nav {
      display: grid;
      gap: 8px;
      margin: 14px 0 18px;
    }

    .page-nav button {
      width: 100%;
      text-align: right;
      border: 1px solid rgba(255,255,255,0.14);
      cursor: pointer;
      border-radius: 14px;
      padding: 13px 14px;
      color: white;
      background: rgba(255,255,255,0.07);
      font-weight: 800;
      transition: 0.15s ease;
    }

    .page-nav button:hover,
    .page-nav button.active {
      background: var(--accent);
      color: var(--brand);
    }

    .page { display: none; }
    .page.active { display: block; }

    .calendar-shell {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 20px;
      align-items: start;
      direction: rtl;
    }

    .month-menu {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      position: sticky;
      top: 28px;
    }

    .month-menu h3 {
      margin: 0 0 14px;
      font-size: 20px;
    }


    .year-switcher {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .year-btn {
      border: 1px solid var(--line);
      background: #faf9f2;
      color: var(--brand);
      padding: 10px 8px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 900;
    }

    .year-btn.active,
    .year-btn:hover {
      background: var(--brand);
      color: white;
      border-color: var(--brand);
    }

    .month-btn {
      width: 100%;
      border: 1px solid var(--line);
      background: #faf9f2;
      color: var(--brand);
      padding: 12px 14px;
      border-radius: 13px;
      text-align: right;
      cursor: pointer;
      margin-bottom: 8px;
      font-weight: 800;
    }

    .month-btn.active,
    .month-btn:hover {
      background: var(--accent);
      color: var(--brand);
    }

    .calendar-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .calendar-title-row {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      margin-bottom: 18px;
    }

    .calendar-title-row h2 {
      margin: 0;
      font-size: 34px;
    }

    .calendar-help {
      color: var(--muted);
      margin: 4px 0 0;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      background: var(--line);
      gap: 1px;
    }

    .weekday {
      background: var(--brand);
      color: white;
      font-weight: 900;
      text-align: center;
      padding: 10px 6px;
      font-size: 14px;
    }

    .calendar-day {
      min-height: 125px;
      background: white;
      padding: 10px;
      position: relative;
    }

    .calendar-day.empty-day {
      background: #f8f5ea;
    }

    .calendar-day.drag-over {
      outline: 3px solid var(--accent);
      outline-offset: -3px;
      background: #fffdf3;
    }

    .day-number {
      font-weight: 900;
      color: var(--brand);
      margin-bottom: 8px;
    }

    .calendar-event {
      background: var(--accent-soft);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 7px 8px;
      margin-bottom: 6px;
      font-size: 13px;
      line-height: 1.35;
      cursor: pointer;
    }

    .calendar-event strong {
      display: block;
      color: var(--brand);
    }

    .calendar-event small {
      color: var(--muted);
    }

    .calendar-drop-hint {
      color: #aaa;
      font-size: 12px;
      margin-top: 8px;
    }

    .calendar-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0 18px;
    }

    .stat-chip {
      background: #faf9f2;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 12px;
      font-weight: 800;
      color: var(--brand);
      font-size: 13px;
    }

    .drag-note {
      margin-top: 14px;
      padding: 12px;
      border-radius: 14px;
      background: rgba(255,255,255,0.08);
      color: #ddd6c4;
      font-size: 13px;
      line-height: 1.5;
    }

    .tags-row{
      margin-top: 18px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tag{
      background: var(--accent-soft);
      color: var(--brand);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 800;
    }

    .calendar-event {
      position: relative;
      padding-left: 30px;
    }

    .delete-calendar-item {
      position: absolute;
      left: 6px;
      top: 6px;
      width: 20px;
      height: 20px;
      border: none;
      border-radius: 999px;
      background: rgba(156,44,44,0.12);
      color: var(--danger);
      cursor: pointer;
      font-weight: 900;
      line-height: 20px;
      padding: 0;
    }

    .delete-calendar-item:hover {
      background: var(--danger);
      color: white;
    }


    .mobile-menu-btn,
    .mobile-menu-backdrop,
    .mobile-add-btn {
      display: none;
    }


    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }

      aside {
        position: fixed;
        right: 0;
        top: 0;
        width: 86%;
        max-width: 360px;
        height: 100vh;
        z-index: 100;
        transform: translateX(105%);
        transition: transform 0.25s ease;
        box-shadow: -10px 0 35px rgba(0,0,0,0.22);
      }

      body.menu-open aside {
        transform: translateX(0);
      }

      .mobile-menu-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.32);
        z-index: 90;
      }

      body.menu-open .mobile-menu-backdrop {
        display: block;
      }

      .mobile-menu-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        position: sticky;
        top: 10px;
        z-index: 60;
        margin-bottom: 12px;
        border: none;
        border-radius: 14px;
        padding: 12px 16px;
        background: var(--brand);
        color: white;
        font-weight: 900;
        box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      }

      .meta-grid { grid-template-columns: 1fr; }
      .calendar-shell { grid-template-columns: 1fr; }
      .month-menu { position: relative; top: 0; }
      .calendar-day { min-height: 112px; padding: 8px; }
      .calendar-grid { font-size: 13px; }
      .calendar-title-row { align-items: flex-start; flex-direction: column; }
      main { padding: 16px; }

      .calendar-drop-hint { display: none; }

      .mobile-add-btn {
        display: inline-flex;
        border: 1px solid var(--line);
        background: #faf9f2;
        color: var(--brand);
        border-radius: 10px;
        padding: 5px 8px;
        font-weight: 900;
        font-size: 12px;
        cursor: pointer;
        margin-bottom: 6px;
      }

      .calendar-event {
        font-size: 12px;
        padding: 6px 7px 6px 28px;
      }
    }

    @media print {
      body { background: white; }
      aside, .topbar, .toolbar, .toast { display: none !important; }
      .app { display: block; }
      main { padding: 0; }
      .hero, .block, .calendar-panel { box-shadow: none; break-inside: avoid; }
      .hero { border: none; padding: 0 0 12px; margin-bottom: 10px; }
      .hero h2 { font-size: 28px; }
      .subtitle, .goal-line { font-size: 14px; margin-bottom: 8px; }
      .block { border: 1px solid #ccc; margin-bottom: 8px; padding: 12px; }
      .block h3 { font-size: 17px; margin-bottom: 6px; }
      .block-content { font-size: 13px; line-height: 1.45; }
      .meta-grid { grid-template-columns: 110px 1fr; gap: 6px; }
      .meta-card { padding: 8px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="logo">
        <div class="logo-mark">A</div>
        <div>
          <h1>ALOUSH</h1>
          <small>ספריית אימונים</small>
        </div>
      </div>

      <div class="page-nav">
        <button id="libraryNavBtn" class="active" onclick="showPage('library')">ספריית אימונים</button>
        <button id="calendarNavBtn" onclick="showPage('calendar')">לוח אימונים</button>
      </div>

      <input id="searchInput" class="search" placeholder="חיפוש לפי מספר, שם, ציוד, תגיות..." />

      <div class="side-title">סוגי אימון</div>
      <div id="categoryList"></div>

      <div class="side-title">אימונים</div>
      <div id="workoutList"></div>
    </aside>

    <main>
      <button class="mobile-menu-btn" onclick="toggleMobileMenu()">☰ תפריט אימונים</button>
      <section id="libraryPage" class="page active">
        <div class="topbar">
          <div>
            <strong id="resultCount">טוען...</strong>
          </div>
          <div class="toolbar">
            <button class="action secondary" id="backToCalendarBtn" style="display:none">חזרה ללוח</button>
            <button class="action secondary" id="printBtn">הדפסה / PDF</button>
            <button class="action secondary" id="editBtn">עריכה</button>
            <button class="action" id="saveBtn" style="display:none">שמירה</button>
            <button class="action danger" id="archiveBtn">מחיקה</button>
          </div>
        </div>

        <section id="workoutView" class="workout-view">
          <div class="empty">טוען אימונים...</div>
        </section>
      </section>

      <section id="calendarPage" class="page">
        <div class="calendar-shell">
          <aside class="month-menu">
            <h3>חודשים</h3>
            <div id="monthList"></div>
          </aside>

          <section class="calendar-panel">
            <div class="calendar-title-row">
              <div>
                <h2 id="calendarTitle">לוח אימונים</h2>
                <p class="calendar-help">במחשב: גררי אימון מהרשימה הימנית לתוך יום בלוח. בפלאפון: לחצי + הוסף בתוך יום.</p>
              </div>
              <div class="toolbar">
                <button class="action secondary" onclick="printCalendar()">הדפסה / PDF</button>
                <button class="action secondary" onclick="loadCalendarItems()">רענון לוח</button>
              </div>
            </div>

            <div id="calendarStats" class="calendar-stats"></div>
            <div id="calendarGrid" class="calendar-grid"></div>
          </section>
        </div>
      </section>
    </main>
  </div>

  <div class="mobile-menu-backdrop" onclick="closeMobileMenu()"></div>
  <div class="toast" id="toast"></div>

  <script>
    const SUPABASE_URL = "https://xnkprwyhqkpstbmmewho.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_CwRxGedCZb4ARlQp3OwZwQ_0JMhyMLV";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let workouts = [];
    let blocksByWorkout = new Map();
    let selectedWorkoutId = null;
    let selectedCategory = "all";
    let currentPage = "library";
    let lastPageBeforeWorkout = "library";
    let calendarItems = [];
    const AVAILABLE_CALENDAR_YEARS = [2026, 2027, 2028];
    let selectedCalendarYear = AVAILABLE_CALENDAR_YEARS.includes(new Date().getFullYear())
      ? new Date().getFullYear()
      : 2026;
    let selectedCalendarMonth = new Date().getMonth();
    let searchTerm = "";
    let editMode = false;
    let studyMode = false;

    const el = (id) => document.getElementById(id);

    function toast(message) {
      const t = el("toast");
      t.textContent = message;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2500);
    }

    function normalize(value) {
      return String(value || "").toLowerCase().trim();
    }

    function filteredWorkouts() {
      return workouts.filter(w => {
        const categoryOk = selectedCategory === "all" || w.category === selectedCategory;
        const q = normalize(searchTerm);
        const haystack = normalize([
          w.workout_number, w.title, w.category, w.goal, w.equipment, w.tags, w.activity_type
        ].join(" "));
        const searchOk = !q || haystack.includes(q);
        return categoryOk && searchOk && w.status !== "archived";
      }).sort((a,b) => Number(a.workout_number) - Number(b.workout_number));
    }


    function showPage(page) {
      currentPage = page;
      el("libraryPage").classList.toggle("active", page === "library");
      el("calendarPage").classList.toggle("active", page === "calendar");
      el("libraryNavBtn").classList.toggle("active", page === "library");
      el("calendarNavBtn").classList.toggle("active", page === "calendar");

      closeMobileMenu();

      if (page === "calendar") {
        renderMonths();
        loadCalendarItems();
      }
    }

    function renderMonths() {
      const monthNames = [
        "ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני",
        "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"
      ];

      el("monthList").innerHTML = `
        <div class="year-switcher">
          ${AVAILABLE_CALENDAR_YEARS.map(year => `
            <button class="year-btn ${year === selectedCalendarYear ? "active" : ""}" data-year="${year}">
              ${year}
            </button>
          `).join("")}
        </div>

        ${monthNames.map((name, index) => `
          <button class="month-btn ${index === selectedCalendarMonth ? "active" : ""}" data-month="${index}">
            ${name} ${selectedCalendarYear}
          </button>
        `).join("")}
      `;

      document.querySelectorAll(".year-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          selectedCalendarYear = Number(btn.dataset.year);
          renderMonths();
          loadCalendarItems();
        });
      });

      document.querySelectorAll(".month-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          selectedCalendarMonth = Number(btn.dataset.month);
          renderMonths();
          loadCalendarItems();
        });
      });
    }

    function toggleMobileMenu() {
      document.body.classList.toggle("menu-open");
    }

    function closeMobileMenu() {
      document.body.classList.remove("menu-open");
    }

    function isMobileView() {
      return window.matchMedia("(max-width: 900px)").matches;
    }

    async function addWorkoutToCalendarMobile(date) {
      if (!date) return;
      const input = prompt("איזה מספר אימון להוסיף ליום הזה?\nלדוגמה: 1 או 101");
      if (!input) return;

      const normalized = String(input).trim();
      const workout = workouts.find(w => String(w.workout_number).trim() === normalized);

      if (!workout) {
        toast("לא מצאתי אימון מספר " + normalized);
        return;
      }

      await addWorkoutToCalendar(workout.id, date);
    }

    async function loadCalendarItems() {
      const start = new Date(selectedCalendarYear, selectedCalendarMonth, 1);
      const end = new Date(selectedCalendarYear, selectedCalendarMonth + 1, 1);
      const startText = toDateText(start);
      const endText = toDateText(end);

      const { data, error } = await db
        .from("calendar_items")
        .select("*")
        .gte("activity_date", startText)
        .lt("activity_date", endText)
        .order("activity_date", { ascending: true });

      if (error) {
        console.error(error);
        toast("שגיאה בטעינת לוח האימונים. בדקי הרשאות RLS לקריאה.");
        calendarItems = [];
      } else {
        calendarItems = data || [];
      }

      renderCalendar();
    }

    function toDateText(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function renderCalendar() {
      const monthNames = [
        "ינואר", "פברואר", "מרץ", "אפריל", "מאי", "יוני",
        "יולי", "אוגוסט", "ספטמבר", "אוקטובר", "נובמבר", "דצמבר"
      ];
      const weekdays = ["א׳", "ב׳", "ג׳", "ד׳", "ה׳", "ו׳", "ש׳"];

      el("calendarTitle").textContent = `${monthNames[selectedCalendarMonth]} ${selectedCalendarYear}`;

      const activeItems = calendarItems.map(item => {
        const workout = workouts.find(w => w.id === item.workout_id);
        return { ...item, workout };
      });

      const counts = {};
      activeItems.forEach(item => {
        const key = item.workout?.category || item.activity_type || "אחר";
        counts[key] = (counts[key] || 0) + 1;
      });

      el("calendarStats").innerHTML = Object.keys(counts).length
        ? Object.entries(counts).map(([key, count]) => `<span class="stat-chip">${key}: ${count}</span>`).join("")
        : `<span class="stat-chip">אין עדיין פעילויות בחודש זה</span>`;

      const firstDay = new Date(selectedCalendarYear, selectedCalendarMonth, 1);
      const daysInMonth = new Date(selectedCalendarYear, selectedCalendarMonth + 1, 0).getDate();
      const firstWeekday = firstDay.getDay();

      let cells = weekdays.map(day => `<div class="weekday">${day}</div>`).join("");

      for (let i = 0; i < firstWeekday; i++) {
        cells += `<div class="calendar-day empty-day"></div>`;
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateText = toDateText(new Date(selectedCalendarYear, selectedCalendarMonth, day));
        const dayItems = activeItems.filter(item => item.activity_date === dateText);

        cells += `
          <div class="calendar-day" data-date="${dateText}">
            <div class="day-number">${day}</div>
            <button class="mobile-add-btn" data-date="${dateText}">+ הוסף</button>
            ${dayItems.map(item => calendarEventHtml(item)).join("")}
            <div class="calendar-drop-hint">גררי לכאן</div>
          </div>
        `;
      }

      el("calendarGrid").innerHTML = cells;

      document.querySelectorAll(".calendar-day:not(.empty-day)").forEach(dayEl => {
        dayEl.addEventListener("dragover", (event) => {
          event.preventDefault();
          dayEl.classList.add("drag-over");
        });

        dayEl.addEventListener("dragleave", () => {
          dayEl.classList.remove("drag-over");
        });

        dayEl.addEventListener("drop", async (event) => {
          event.preventDefault();
          dayEl.classList.remove("drag-over");
          const workoutId = Number(event.dataTransfer.getData("text/plain"));
          const date = dayEl.dataset.date;
          if (workoutId && date) await addWorkoutToCalendar(workoutId, date);
        });
      });

      document.querySelectorAll(".mobile-add-btn").forEach(btn => {
        btn.addEventListener("click", async (event) => {
          event.stopPropagation();
          const date = btn.dataset.date;
          await addWorkoutToCalendarMobile(date);
        });
      });

      document.querySelectorAll(".calendar-event").forEach(eventEl => {
        eventEl.addEventListener("click", (event) => {
          if (event.target.classList.contains("delete-calendar-item")) return;
          const workoutId = Number(eventEl.dataset.workoutId);
          if (workoutId) {
            lastPageBeforeWorkout = "calendar";
            selectedWorkoutId = workoutId;
            showPage("library");
            renderAll();
            closeMobileMenu();
            window.scrollTo({ top: 0, behavior: "smooth" });
          }
        });
      });

      document.querySelectorAll(".delete-calendar-item").forEach(btn => {
        btn.addEventListener("click", async (event) => {
          event.stopPropagation();
          const id = Number(btn.dataset.id);
          if (!id) return;
          const ok = confirm("למחוק את הפעילות מהלוח?");
          if (!ok) return;

          const { error } = await db
            .from("calendar_items")
            .delete()
            .eq("id", id);

          if (error) {
            console.error(error);
            toast("לא הצלחתי למחוק מהלוח. בדקי הרשאת delete בטבלת calendar_items.");
            return;
          }

          toast("הפעילות נמחקה מהלוח");
          await loadCalendarItems();
        });
      });
    }

    function calendarEventHtml(item) {
      const workout = item.workout;
      const title = workout
        ? `אימון ${workout.workout_number}`
        : (item.custom_title || "פעילות");
      const subtitle = workout
        ? (workout.title || workout.category || "")
        : (item.activity_type || "");

      return `
        <div class="calendar-event" data-calendar-id="${item.id}" data-workout-id="${workout?.id || ""}">
          <button class="delete-calendar-item" data-id="${item.id}" title="מחיקה">×</button>
          <strong>${title}</strong>
          <small>${subtitle}</small>
        </div>
      `;
    }

    async function addWorkoutToCalendar(workoutId, date) {
      const workout = workouts.find(w => w.id === workoutId);
      const payload = {
        activity_date: date,
        workout_id: workoutId,
        custom_title: workout ? `אימון ${workout.workout_number}` : null,
        activity_type: "workout",
        notes: null
      };

      const { error } = await db
        .from("calendar_items")
        .insert(payload);

      if (error) {
        console.error(error);
        toast("לא הצלחתי לשמור ללוח. בדקי הרשאת insert בטבלת calendar_items.");
        return;
      }

      toast("האימון נוסף ללוח");
      await loadCalendarItems();
    }

    function printCalendar() {
      const oldPage = currentPage;
      showPage("calendar");
      setTimeout(() => window.print(), 100);
      currentPage = oldPage;
    }


    async function loadData() {
      el("workoutView").innerHTML = `<div class="empty">טוען נתונים מ־Supabase...</div>`;

      const { data: workoutData, error: workoutError } = await db
        .from("workouts")
        .select("*")
        .order("workout_number", { ascending: true });

      if (workoutError) {
        console.error(workoutError);
        el("workoutView").innerHTML = `<div class="empty">שגיאה בטעינת אימונים. בדקי הרשאות RLS לקריאה.</div>`;
        return;
      }

      const { data: blockData, error: blockError } = await db
        .from("workout_blocks")
        .select("*")
        .order("block_order", { ascending: true });

      if (blockError) {
        console.error(blockError);
        el("workoutView").innerHTML = `<div class="empty">שגיאה בטעינת בלוקים. בדקי הרשאות RLS לקריאה.</div>`;
        return;
      }

      workouts = workoutData || [];
      blocksByWorkout = new Map();
      (blockData || []).forEach(block => {
        const list = blocksByWorkout.get(block.workout_id) || [];
        list.push(block);
        blocksByWorkout.set(block.workout_id, list);
      });

      const hashId = Number(location.hash.replace("#workout-", ""));
      selectedWorkoutId = hashId || (filteredWorkouts()[0]?.id ?? null);
      renderAll();
    }

    function renderAll() {
      renderCategories();
      renderWorkoutList();
      renderWorkout();
      if (currentPage === "calendar") renderCalendar();
    }

    function renderCategories() {
      const categories = ["all", ...new Set(workouts.map(w => w.category).filter(Boolean))];
      el("categoryList").innerHTML = categories.map(cat => {
        const label = cat === "all" ? "כל האימונים" : cat;
        const count = cat === "all"
          ? workouts.filter(w => w.status !== "archived").length
          : workouts.filter(w => w.category === cat && w.status !== "archived").length;
        return `
          <button class="category-btn ${selectedCategory === cat ? "active" : ""}" data-category="${cat}">
            <span class="category-row"><span>${label}</span><span class="count">${count}</span></span>
          </button>
        `;
      }).join("");

      document.querySelectorAll(".category-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          selectedCategory = btn.dataset.category;
          const first = filteredWorkouts()[0];
          if (first) selectedWorkoutId = first.id;
          renderAll();
        });
      });
    }

    function renderWorkoutList() {
      const list = filteredWorkouts();
      el("resultCount").textContent = `${list.length} אימונים מוצגים`;
      el("workoutList").innerHTML = list.map(w => `
        <button class="workout-btn ${w.id === selectedWorkoutId ? "active" : ""}" data-id="${w.id}" draggable="true">
          <span class="workout-row">
            <span>אימון ${w.workout_number} · ${w.title || "ללא שם"}</span>
          </span>
        </button>
      `).join("") || `<div style="color:#d7d2c1">לא נמצאו אימונים</div>`;

      document.querySelectorAll(".workout-btn").forEach(btn => {
        btn.addEventListener("dragstart", (event) => {
          event.dataTransfer.setData("text/plain", btn.dataset.id);
        });

        btn.addEventListener("click", () => {
          selectedWorkoutId = Number(btn.dataset.id);
          location.hash = `workout-${selectedWorkoutId}`;
          editMode = false;
          if (currentPage !== "library") showPage("library");
          lastPageBeforeWorkout = "library";
          editMode = false;
          renderAll();
          closeMobileMenu();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });
    }

    function cleanBlockTitle(title) {
      return String(title || "בלוק").replaceAll("רמה A", "צוות 100");
    }

    function replaceTeamText(text) {
      return String(text || "").replaceAll("רמה A", "צוות 100");
    }

    function renderTags(tagsText) {
      const tags = String(tagsText || "")
        .split(",")
        .map(tag => tag.trim())
        .filter(Boolean);

      if (!tags.length) return "";

      return `
        <div class="tags-row">
          ${tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}
        </div>
      `;
    }

    function renderWorkout() {
      const workout = workouts.find(w => w.id === selectedWorkoutId);
      if (!workout) {
        el("workoutView").innerHTML = `<div class="empty">בחרי אימון מהרשימה</div>`;
        return;
      }

      const blocks = blocksByWorkout.get(workout.id) || [];
      document.body.classList.toggle("study", false);
      el("saveBtn").style.display = editMode ? "inline-block" : "none";
      el("editBtn").textContent = editMode ? "ביטול עריכה" : "עריכה";
      el("backToCalendarBtn").style.display = lastPageBeforeWorkout === "calendar" ? "inline-block" : "none";

      if (editMode) {
        renderEditWorkout(workout, blocks);
        return;
      }

      el("workoutView").innerHTML = `
        <article class="hero">
          <div class="kicker">${workout.category || "ללא קטגוריה"} · ${workout.activity_type || "workout"}</div>
          <h2>אימון ${workout.workout_number}</h2>
          <p class="subtitle">${workout.title || "ללא שם"}</p>
          <p class="goal-line">${workout.goal || ""}</p>
          <div class="meta-grid">
            <div class="meta-card"><small>משך</small><strong>${workout.duration_minutes || "—"} דקות</strong></div>
            <div class="meta-card"><small>ציוד</small><strong>${workout.equipment || "—"}</strong></div>
          </div>
        </article>

        <section class="blocks">
          ${blocks
            .filter(block =>
              block.title !== "מטרת האימון" &&
              block.title !== "ציוד והכנות"
            )
            .map(block => `
            <div class="block" data-block-id="${block.id}">
              <h3>${cleanBlockTitle(block.title || "בלוק")}</h3>
              <div class="block-content">${escapeHtml(replaceTeamText(block.content || ""))}</div>
              ${block.media_url ? `<img src="${block.media_url}" alt="${block.title || "media"}" />` : ""}
              <div class="study-hint">לחצי על הבלוק כדי לחשוף / להסתיר</div>
            </div>
          `).join("") || `<div class="empty">אין עדיין בלוקים לאימון הזה</div>`}
        </section>

        ${renderTags(workout.tags)}
      `;

      document.querySelectorAll(".block").forEach(block => {
        block.addEventListener("click", () => {
          if (studyMode) block.classList.toggle("revealed");
        });
      });
    }

    function renderEditWorkout(workout, blocks) {
      el("workoutView").innerHTML = `
        <article class="hero">
          <div class="kicker">עריכת אימון</div>
          <label>שם אימון</label>
          <input class="edit-input" id="editTitle" value="${attr(workout.title)}" />
          <br><br>
          <label>מטרה</label>
          <textarea id="editGoal">${escapeHtml(workout.goal || "")}</textarea>
          <br><br>
          <label>ציוד</label>
          <textarea id="editEquipment">${escapeHtml(workout.equipment || "")}</textarea>
        </article>
        <section class="blocks">
          ${blocks.map(block => `
            <div class="block">
              <h3>${cleanBlockTitle(block.title || "בלוק")}</h3>
              <label>כותרת בלוק</label>
              <input class="edit-input block-title" data-id="${block.id}" value="${attr(block.title)}" />
              <br><br>
              <label>תוכן</label>
              <textarea class="block-content-edit" data-id="${block.id}">${escapeHtml(replaceTeamText(block.content || ""))}</textarea>
              <br><br>
              <label>media_url</label>
              <input class="edit-input block-media" data-id="${block.id}" value="${attr(block.media_url)}" />
            </div>
          `).join("")}
        </section>
      `;
    }

    async function saveEdits() {
      const workout = workouts.find(w => w.id === selectedWorkoutId);
      if (!workout) return;

      const workoutPatch = {
        title: el("editTitle").value,
        goal: el("editGoal").value,
        equipment: el("editEquipment").value
      };

      const { error: workoutError } = await db
        .from("workouts")
        .update(workoutPatch)
        .eq("id", workout.id);

      if (workoutError) {
        console.error(workoutError);
        toast("שגיאה בשמירה. כנראה חסרה הרשאת update.");
        return;
      }

      const titleInputs = [...document.querySelectorAll(".block-title")];
      for (const input of titleInputs) {
        const id = Number(input.dataset.id);
        const content = document.querySelector(`.block-content-edit[data-id="${id}"]`)?.value || "";
        const media_url = document.querySelector(`.block-media[data-id="${id}"]`)?.value || null;
        const { error } = await db
          .from("workout_blocks")
          .update({ title: input.value, content, media_url })
          .eq("id", id);
        if (error) {
          console.error(error);
          toast("חלק מהבלוקים לא נשמרו. בדקי הרשאות update.");
          return;
        }
      }

      toast("נשמר בהצלחה");
      editMode = false;
      await loadData();
    }

    async function archiveWorkout() {
      const workout = workouts.find(w => w.id === selectedWorkoutId);
      if (!workout) return;
      const ok = confirm(`לארכב את אימון ${workout.workout_number}? הוא לא יופיע ברשימה.`);
      if (!ok) return;
      const { error } = await db.from("workouts").update({ status: "archived" }).eq("id", workout.id);
      if (error) {
        console.error(error);
        toast("שגיאה בארכוב. כנראה חסרה הרשאת update.");
        return;
      }
      toast("האימון אורכב");
      selectedWorkoutId = null;
      await loadData();
    }

    function escapeHtml(str) {
      return String(str || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function attr(str) { return escapeHtml(str || ""); }

    el("searchInput").addEventListener("input", (e) => {
      searchTerm = e.target.value;
      const first = filteredWorkouts()[0];
      if (first && !filteredWorkouts().some(w => w.id === selectedWorkoutId)) selectedWorkoutId = first.id;
      renderAll();
    });

    el("printBtn").addEventListener("click", () => window.print());
    el("backToCalendarBtn").addEventListener("click", () => {
      showPage("calendar");
      lastPageBeforeWorkout = "library";
      renderWorkout();
    });
    el("editBtn").addEventListener("click", () => { editMode = !editMode; renderWorkout(); });
    el("saveBtn").addEventListener("click", saveEdits);
    el("archiveBtn").addEventListener("click", archiveWorkout);

    loadData();
  </script>
</body>
</html>
